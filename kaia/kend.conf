# Configuration file for kend (Kaia Endpoint Node)
# This file will be populated by docker-entrypoint.sh from environment variables

# Network: mainnet or kairos
NETWORK="mainnet"

# Data directory
DATA_DIR=/var/kend/data

# Log directory
LOG_DIR=/var/kend/logs

# Ports
PORT=32323
RPC_PORT=8551
WS_PORT=8552

# Server type
SERVER_TYPE="http"

# Sync mode: full or snap
SYNCMODE="full"

# Verbosity: 0=silent, 1=error, 2=warn, 3=info, 4=debug, 5=detail
VERBOSITY=3

# Max connections
MAXCONNECTIONS=100

# txpool options
TXPOOL_EXEC_SLOTS_ALL=4096
TXPOOL_NONEXEC_SLOTS_ALL=4096
TXPOOL_EXEC_SLOTS_ACCOUNT=4096
TXPOOL_NONEXEC_SLOTS_ACCOUNT=4096
TXPOOL_LIFE_TIME="30m"

# RPC options
RPC_ENABLE=1
RPC_API="klay,eth,net,web3"
RPC_ADDR="0.0.0.0"
RPC_CORSDOMAIN="*"
RPC_VHOSTS="*"
RPC_CONCURRENCYLIMIT=3000
RPC_READ_TIMEOUT=30
RPC_WRITE_TIMEOUT=30
RPC_IDLE_TIMEOUT=120
RPC_EXECUTION_TIMEOUT=30

# WebSocket options
WS_ENABLE=1
WS_API="klay,eth,net,web3"
WS_ADDR="0.0.0.0"
WS_ORIGINS="*"

# Metrics
METRICS=1
PROMETHEUS=1

# Additional options (will be set by docker-entrypoint.sh)
ADDITIONAL=""
